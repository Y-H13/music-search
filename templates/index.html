<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Vibe-Mixer: 楽曲レコメンドエンジン</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        
        #player-container { margin: 20px 0; display: flex; justify-content: center; background: #000; border-radius: 10px; overflow: hidden; }
        
        /* 検索ボックスのデザイン */
        .search-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        #title-input { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; width: 60%; font-size: 1em; }
        .search-btn { padding: 10px 20px; border-radius: 5px; border: none; background: #e50914; color: #fff; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background: #f6121d; }

        /* 気分（タグ）ボタンのデザイン */
        #filter-buttons { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { background: #2b2b2b; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .filter-btn:hover { background: #e50914; border-color: #e50914; }
        
        /* 楽曲カードのデザイン */
        #track-list { display: grid; gap: 15px; }
        .track-card { background: #1e1e1e; padding: 15px; border-radius: 8px; cursor: pointer; border-left: 4px solid #444; transition: 0.2s; }
        .track-card:hover { background: #2a2a2a; border-left-color: #e50914; transform: translateX(5px); }
        .tag { display: inline-block; background: #444; padding: 4px 10px; border-radius: 12px; font-size: 0.8em; margin-bottom: 8px; color: #ddd; }
        .title { font-size: 1.3em; margin: 0 0 8px 0; font-weight: bold; color: #fff; }
        .description { font-size: 1em; color: #bbb; margin: 0; line-height: 1.4; }
    </style>
</head>
<body>
    <h1>🎵 櫻坂46 楽曲レコメンド</h1>
    
    <div class="search-container">
        <input type="text" id="title-input" placeholder="曲名で探す (例: 承認欲求)" onkeypress="handleKeyPress(event)">
        <button class="search-btn" onclick="fetchTracks()">検索</button>
    </div>

    <div id="filter-buttons">
        <button class="filter-btn" onclick="setTag('')">🌐 すべて表示</button>
        <button class="filter-btn" onclick="setTag('覚悟')">🔥 覚悟を決める</button>
        <button class="filter-btn" onclick="setTag('葛藤')">💧 葛藤に寄り添う</button>
        <button class="filter-btn" onclick="setTag('前向き')">✨ 前向きになりたい</button>
    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <div id="track-list"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentTag = '';
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                videoId: '', 
                // 公式MVがエラーになりにくいよう、自動再生をOFFにして待機させます
                playerVars: { 'rel': 0, 'autoplay': 0 }
            });
        }

        // 曲単体を最初から再生（サムネイルを表示して待機する設定）
        function playTrack(videoId) {
            if (player && player.cueVideoById) {
                player.cueVideoById({
                    'videoId': videoId
                });
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                fetchTracks();
            }
        }

        function setTag(tag) {
            currentTag = tag;
            fetchTracks();
        }

        // /api/tracks からデータを取得する
        function fetchTracks() {
            const titleInput = document.getElementById('title-input').value;
            
            const params = new URLSearchParams();
            if (currentTag) params.append('tag', currentTag);
            if (titleInput) params.append('title', titleInput);

            fetch(`/api/tracks?${params.toString()}`)
                .then(response => response.json())
                .then(data => {
                    const trackList = document.getElementById('track-list');
                    trackList.innerHTML = ''; 

                    if (data.length === 0) {
                        trackList.innerHTML = '<p style="text-align:center; color:#888;">見つかりませんでした。</p>';
                        return;
                    }

                    data.forEach(track => {
                        const card = document.createElement('div');
                        card.className = 'track-card';
                        card.innerHTML = `
                            <div class="tag"># ${track.tag}</div>
                            <h2 class="title">${track.title}</h2>
                            <p class="description">${track.description}</p>
                        `;
                        // カードをクリックしたら曲のMVを読み込む
                        card.onclick = () => playTrack(track.video_id);
                        trackList.appendChild(card);
                    });
                });
        }

        fetchTracks();
    </script>
</body>
</html>
